<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hakvision Rail</title>
<meta name="description" content="Jeu de gestion ferroviaire : du Congo au monde entier, sur une vraie carte en relief.">
<meta name="theme-color" content="#0e1726">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* Hakvision Rail — identité « signal & laiton » : panneaux sombres translucides posés sur une carte en relief,
   accent ambre des signaux ferroviaires, vert voie libre, titres condensés façon signalétique. Un seul thème, sombre. */
:root{color-scheme:dark;
  --ink:#0e1726;--panel:rgba(13,22,37,.86);--panel-solid:#111d31;--card:#182740;--card2:#1f3150;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --text:#eef3fb;--mut:#9cadc6;--amber:#f5a524;--amber2:#ffcf6b;--green:#2fbf71;--red:#f0524f;--blue:#4ea3ff;--warn:#ffb340;
  --fd:"Saira Condensed","Arial Narrow",system-ui,sans-serif;--fb:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;--shadow:0 10px 30px rgba(0,0,0,.35);--blur:saturate(140%) blur(14px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font:15px/1.4 var(--fb);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--amber);outline-offset:2px}
.ic{display:block}
#app{position:relative;height:100%}
#map{position:absolute;inset:0;background:#2c6aa0}
.maperr{display:flex;height:100%;align-items:center;justify-content:center;color:#fff;font:600 18px var(--fb);padding:20px;text-align:center}
.glass{background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--shadow)}
/* barre du haut */
#top{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:900;display:flex;align-items:center;gap:14px;padding:8px 10px 8px 12px;border-radius:var(--r)}
#co{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;min-width:0;text-align:left}
#co .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--amber),#e2731a);display:flex;align-items:center;justify-content:center;flex:none;color:#1b1203;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
#co .who{display:flex;flex-direction:column;min-width:0;line-height:1.1}
#co b{font:700 17px var(--fd);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#co span{display:flex;align-items:center;gap:4px;font:600 13px var(--fb);font-variant-numeric:tabular-nums}
#co .up{color:var(--green)}#co .dn{color:var(--red)}
.sp{flex:1}.br{display:none}
.kv{display:flex;flex-direction:column;line-height:1.05;text-align:right}
.kv small{font:600 11px var(--fd);letter-spacing:.14em;color:var(--mut)}
.kv b{font:700 21px var(--fd);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.kv #pts{color:var(--amber2)}
.gauge{position:relative;width:46px;height:46px;background:none;border:0;padding:0;color:var(--text);flex:none}
.gauge>svg{width:46px;height:46px}.gauge span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.tb{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);position:relative;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font:700 11px/18px var(--fb);min-width:18px;border-radius:9px;text-align:center;font-style:normal;padding:0 4px}
#saved{font-size:14px;cursor:help;opacity:.85}
/* menu de droite */
#hex{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 86px);z-index:800;display:flex;flex-direction:column;gap:6px;padding:8px 6px;border-radius:var(--r)}
.hx{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:6px 4px;width:70px;border-radius:12px;position:relative;color:var(--text)}
.hx:hover{background:rgba(255,255,255,.06)}
.hx .h{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.hx .l{font:600 11px var(--fd);letter-spacing:.1em;color:var(--mut)}
.hx.gold .h{background:linear-gradient(135deg,var(--amber),#e2731a);color:#1b1203;border-color:transparent}.hx.gold .l{color:var(--amber2)}
.hx.alert::after{content:attr(data-n);position:absolute;top:2px;right:8px;background:var(--red);color:#fff;font:700 11px/18px var(--fb);min-width:18px;border-radius:9px;text-align:center}
/* boutons de carte */
#b-list{position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:800;width:52px;height:96px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text)}
#b-list small{font:600 10px var(--fd);letter-spacing:.12em;color:var(--mut)}
#b-list[hidden]{display:none}
#mapbtns{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:800;display:flex;gap:8px}
.mg{display:flex;border-radius:14px;overflow:hidden}
.mg button{background:none;border:0;padding:10px 12px;color:var(--text);display:flex;align-items:center;gap:6px;font:600 13px var(--fd);letter-spacing:.08em}
.mg button+button{border-left:1px solid var(--line)}.mg button:hover{background:rgba(255,255,255,.07)}.mg button.on{background:var(--amber);color:#1b1203}
.maplibregl-ctrl-attrib{font-size:10px}.maplibregl-ctrl-bottom-right{bottom:env(safe-area-inset-bottom,0px)}
/* tiroir des trains */
#drawer{position:absolute;left:10px;top:calc(env(safe-area-inset-top,0px) + 80px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:min(470px,calc(100% - 20px));z-index:950;display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden}
.dh{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.dh h3{flex:1;margin:0;font:700 22px var(--fd);letter-spacing:.08em}
.dh .x{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.dcols{display:grid;grid-template-columns:1.4fr 1fr 1fr 40px;align-items:center;padding:4px 16px 8px;font:600 12px var(--fd);letter-spacing:.12em;color:var(--mut);border-bottom:1px solid var(--line)}
.dlist{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:5px 1.3fr 1fr .9fr 16px 32px;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px 10px 0;cursor:pointer;font-size:15px}
.row:hover{border-color:var(--line2)}
.row .cb,.unit .cb{width:5px;align-self:stretch;border-radius:0 3px 3px 0}
.row b{font:600 17px var(--fd);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .wear{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;color:var(--mut)}.row .wear.bad{color:var(--red)}.row .wear svg rect,.row .wear svg circle{fill:var(--mut)}
.row .when{color:var(--mut);font-size:13.5px;white-space:nowrap}
.row .mini{grid-column:span 2;background:var(--card2);color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:6px 10px;font:600 13px var(--fd);letter-spacing:.06em}
.dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.06)}.dot.green{background:var(--green);box-shadow:0 0 10px var(--green)}.dot.red{background:var(--red)}
.ck{display:flex;align-items:center;justify-content:center}.ck input{width:20px;height:20px;accent-color:var(--amber)}
.prog{height:7px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7be3a6);border-radius:5px}
.prog.bad i{background:var(--red)}
.empty{padding:22px;text-align:center;color:var(--mut)}
.fleet{margin:0 10px 10px;border-radius:14px;padding:12px 14px;text-align:center;background:var(--card);border:1px solid var(--line)}
.fleet h4{margin:0 0 8px;font:600 13px var(--fd);letter-spacing:.16em;color:var(--mut)}
.fleet .hint{font-size:12.5px;color:var(--mut);margin-top:6px}
.go{background:var(--green);color:#04210f;border:0;border-radius:12px;padding:11px 16px;font:700 17px var(--fd);letter-spacing:.08em;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 16px rgba(47,191,113,.25)}
.go:disabled,button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.fleet .go{width:100%}.go.wide{width:100%;margin:4px 0}
.dtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-top:1px solid var(--line)}
.dtabs button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font:600 12px var(--fd);letter-spacing:.08em;position:relative;border-radius:10px}
.dtabs button.on{background:rgba(245,165,36,.14);color:var(--amber2)}
.dtabs .cnt{position:absolute;top:2px;right:calc(50% - 26px);background:var(--card2);color:var(--text);font:600 11px/18px var(--fb);min-width:20px;border-radius:9px;font-style:normal;border:1px solid var(--line2)}
.dtabs button.on .cnt{background:var(--amber);color:#1b1203;border-color:transparent}
/* fenêtres : panneau à droite (ordinateur), feuille en bas (téléphone) — la carte reste visible */
#modal{position:fixed;z-index:1000;right:10px;top:calc(env(safe-area-inset-top,0px) + 80px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:min(500px,calc(100% - 20px));display:flex;pointer-events:none}
#modal[hidden],#drawer[hidden]{display:none}
.sheet{pointer-events:auto;position:relative;background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);width:100%;max-height:100%;display:flex;flex-direction:column;padding:14px 12px 12px}
.sheet h2{margin:2px 48px 12px 6px;font:700 24px var(--fd);letter-spacing:.08em;text-wrap:balance}
.mx{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center}
.stabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-bottom:10px;background:rgba(0,0,0,.2);padding:4px;border-radius:12px}
.stabs button{background:none;border:0;color:var(--mut);font:600 14px var(--fd);letter-spacing:.1em;padding:9px 4px;border-radius:9px}
.stabs button.on{background:var(--amber);color:#1b1203}
.sbody{overflow:auto;padding:2px;display:flex;flex-direction:column;gap:10px;min-height:0}
.sbody p{margin:0}.sbody>*{flex-shrink:0}
.mut{color:var(--mut);font-size:13px}.pad{padding:0 2px}
.sum{display:grid;grid-template-columns:1fr 120px 1fr;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;font-family:var(--fd)}
.sum .half{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.1em;color:var(--mut)}.sum .half.r{text-align:right;align-items:flex-end}
.pill{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 12px;width:max-content}
.pill b{font-size:30px;font-weight:700}.pill svg rect,.pill svg circle{fill:var(--text)}.pill svg path{stroke:var(--card)}
.slots{position:relative;width:110px;height:110px;justify-self:center}
.slots svg{position:absolute;inset:0}.slots svg circle:first-child{stroke:rgba(255,255,255,.1);fill:none}.slots svg circle:last-child{stroke:var(--amber)}
.slots div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.slots b{font:700 24px var(--fd)}.slots small{font:600 10px var(--fd);letter-spacing:.12em;color:var(--mut)}
.slots .plus{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:var(--amber);color:#1b1203;border:0;font:700 18px/1 var(--fb)}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chips button{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font:600 13px var(--fd);letter-spacing:.1em}
.chips button.on{background:var(--amber);color:#1b1203;border-color:transparent}.chips b{margin-left:auto;font:700 18px var(--fd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 0 0;text-align:center;display:flex;flex-direction:column;overflow:hidden;min-width:0;color:var(--text)}
.mcard:hover{border-color:var(--line2)}
.mcard h5{margin:0 10px;font:700 17px var(--fd);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .cap{color:var(--amber2);font:600 13px var(--fd);letter-spacing:.08em;margin:2px 0 8px}
.mcard .pic{position:relative}.art{display:block;width:100%;height:auto}
.tags{position:absolute;top:6px;right:8px;display:flex;gap:4px}.tg{display:flex;align-items:center;justify-content:center;border-radius:7px;padding:2px 6px;font-style:normal;background:rgba(13,22,37,.75)}
.tg svg rect,.tg svg circle{fill:#fff}.tg svg path{stroke:#0d1625}
.own{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mut);font:600 13px var(--fd);letter-spacing:.1em;padding:10px}.own i{font-style:normal;background:var(--amber);color:#1b1203;border-radius:7px;padding:0 9px;font-size:16px}
.mcard .spec{font-size:12px;color:var(--mut);padding:6px 10px}
.mcard .buy{margin:0 10px 10px;background:var(--green);color:#04210f;border:0;border-radius:10px;padding:9px;font:700 16px var(--fd);letter-spacing:.06em}
.mcard.lock{opacity:.5}.mcard.big{cursor:default}
.back{align-self:flex-start;background:none;border:0;color:var(--amber2);font-weight:600}
.unit{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--text)}
.unit>div:first-of-type{flex:1;min-width:0}.unit[data-act]{cursor:pointer}.unit[data-act]:hover{border-color:var(--line2)}
.unit button,.btns button{background:var(--card2);color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font:600 14px var(--fd);letter-spacing:.06em}
.unit button.go,.btns button.go{background:var(--green);color:#04210f;border-color:transparent}
.btns .yel,.yel{background:var(--amber)!important;color:#1b1203!important;border-color:transparent!important}
.btns .danger,.danger{background:transparent;color:#ff8b88;border:1px solid rgba(240,82,79,.6);border-radius:10px;padding:8px 12px;font:600 14px var(--fd);letter-spacing:.06em}
.danger.wide{width:100%;padding:12px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.sico{color:var(--amber2)}
.sec{margin:8px 2px 0;font:700 13px var(--fd);letter-spacing:.18em;color:var(--mut)}
.band{color:var(--amber2)!important}
.form{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.form label,.sbody>label,.two label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.04em}
select,input:not([type=checkbox]):not([type=range]){background:rgba(0,0,0,.25);border:1px solid var(--line2);border-radius:10px;padding:9px;width:100%;color:var(--text);font-size:15px}
select option,select optgroup{background:#111d31;color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prev{background:rgba(78,163,255,.1);border:1px solid rgba(78,163,255,.25);border-radius:12px;padding:10px 12px;display:block;line-height:1.55}.prev>div+div{margin-top:4px}
.prev b{color:#fff}
.err{background:rgba(240,82,79,.12);border:1px solid rgba(240,82,79,.35);color:#ffb3b1;border-radius:12px;padding:9px 12px}
.info{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--mut)}
.mis{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.mis>div{flex:1}.mis small{color:var(--mut)}
.mis button{border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font:700 15px var(--fd);background:var(--card2);color:var(--mut)}.mis button.go{background:var(--amber);color:#1b1203;border-color:transparent}
.mis.got{opacity:.55}.ok{color:var(--green);font-size:22px;font-weight:700}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0}
.kpi span{display:block;font:600 11px var(--fd);color:var(--mut);text-transform:uppercase;letter-spacing:.12em}.kpi b{font:700 20px var(--fd);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.lvl{display:flex;flex-direction:column;gap:4px}
.spark{width:100%;height:auto;display:block}
.fuel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.fh{display:flex;align-items:center;gap:10px}.fh b{flex:1;color:var(--text);font:700 20px var(--fd);letter-spacing:.06em}.fh span{font:700 20px var(--fd);font-variant-numeric:tabular-nums}
.tank{height:12px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden}.tank i{display:block;height:100%}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:14px}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}th{font:600 12px var(--fd);letter-spacing:.1em;color:var(--mut)}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--warn)}
.bars{width:35%}.bars i{display:block;height:6px;border-radius:3px;margin:2px 0}.bars i.p{background:var(--green)}.bars i.n{background:var(--red)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.msg.new{border-left:3px solid var(--amber)}.msg small{float:right;color:var(--mut)}.msg p{margin:6px 0 0;color:var(--mut)}
.help{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.hubs{display:flex;flex-wrap:wrap;gap:8px}.hubchip{display:flex;flex-direction:column;align-items:flex-start;background:rgba(245,165,36,.1);border:1px solid rgba(245,165,36,.45);border-radius:12px;padding:6px 10px;font:700 15px var(--fd);letter-spacing:.04em;color:var(--text)}.hubchip small{font:500 12px var(--fb);color:var(--mut)}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}.regions button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font:600 15px var(--fd);letter-spacing:.04em;text-align:left}
.hubok{background:rgba(245,165,36,.1);border:1px solid rgba(245,165,36,.45);border-radius:12px;padding:8px 12px;font-weight:600}
.rbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:700 16px var(--fd);letter-spacing:.06em}
.rbar span{display:flex;justify-content:center;gap:6px;border-top:2px solid var(--amber);padding-top:6px}.rbar span i{font-style:normal;background:var(--amber);color:#1b1203;border-radius:7px;padding:1px 8px;font-size:13px}
.switch{display:flex!important;flex-direction:row!important;align-items:center;justify-content:center;gap:14px;font:600 15px var(--fd)!important;letter-spacing:.1em!important;color:var(--text)!important;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}.switch i{width:52px;height:28px;border-radius:14px;background:rgba(255,255,255,.14);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0006;transition:left .15s}
.switch input:checked+i{background:var(--green)}.switch input:checked+i::after{left:27px}
.stops{display:flex;flex-direction:column;gap:4px}

  #drawer{left:0;right:0;width:100%;top:auto;bottom:0;height:80%;border-radius:20px 20px 0 0}
  .row{font-size:14px;grid-template-columns:5px 1.2fr 1fr .9fr 14px 28px;gap:6px}.row b{font-size:15px}

}
