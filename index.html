<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hakvision Rail</title>
<meta name="description" content="Jeu de gestion de trains au Congo et dans le monde.">
<meta name="theme-color" content="#1b2257">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* Mise en page : carte plein écran, barre bleu nuit en haut, menu hexagonal à droite, tiroir à gauche, fenêtres centrées. Un seul thème (style « jeu mobile »). */
:root{color-scheme:light;--navy:#1b2257;--navy2:#252e6e;--navy3:#2f3a86;--ink:#14183a;--yellow:#ffcc1a;--green:#1f9d3a;--red:#e23b3b;--paper:#f4f5fb;--line:#d8dbea;--mut:#69708f;--blue:#1e88ff;
  --f:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;--fb:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--navy);color:var(--ink);font:15px/1.35 var(--fb);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.ic{display:block}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));position:relative;z-index:900}
#top .k{display:flex;flex-direction:column;font-family:var(--f);line-height:1.1}
#top .k small{font-size:13px;letter-spacing:.06em;color:#d9ddf5}
#top .k b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
#top .k #pts{color:var(--yellow)}
#top .sp{flex:1}
.gauge{position:relative;width:54px;height:54px;background:none;border:0;padding:0;color:#fff}
.gauge span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.tb{background:none;border:0;color:#fff;position:relative;padding:4px}
.badge{position:absolute;top:-2px;right:-4px;background:var(--red);color:#fff;font:700 11px/18px var(--fb);min-width:18px;border-radius:9px;text-align:center;font-style:normal}
#saved{font-size:15px;cursor:help}
#co{position:absolute;top:100%;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:6px 16px;border-radius:0 0 10px 10px;font-family:var(--f);font-size:17px;white-space:nowrap;max-width:calc(100% - 140px);cursor:pointer;border:0}
#co b{letter-spacing:.04em;font-weight:600;overflow:hidden;text-overflow:ellipsis}
#co span{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
#co .dn svg{color:#ff6b6b}#co .up svg{color:#4ade80}
#map{flex:1;background:#aad3df}
.leaflet-container{font-family:var(--fb);background:#aad3df}
.slab{background:none;border:0;box-shadow:none;padding:0;color:#4b4b4b;font:500 12px var(--fb);text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff}
.slab.big{font-size:14px;color:#2d2d2d}.slab:before{display:none}
.clab{color:#8e6f9e;font:italic 500 15px Georgia,serif;text-align:center;text-shadow:0 0 3px #f2efe9;white-space:nowrap;pointer-events:none}
.tm{width:44px;height:44px;border-radius:50%;background:#fff;border:4px solid var(--c);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0005}
.tm.station{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c)}
/* menu hexagonal */
#hex{position:absolute;right:8px;top:200px;z-index:800;display:flex;flex-direction:column;gap:8px;align-items:center}
.hx{display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;width:96px;position:relative}
.hx .h{width:76px;height:66px;background:var(--navy);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);display:flex;align-items:center;justify-content:center;color:#fff}
.hx .l{position:relative;z-index:1;margin-top:-8px;background:#fff;color:var(--navy);font:600 13px var(--f);letter-spacing:.04em;padding:3px 8px;border-radius:12px;box-shadow:0 1px 3px #0003;white-space:nowrap}
.hx.gold .h{background:var(--yellow);color:var(--navy)}.hx.gold .l{background:var(--yellow)}
.hx.alert::after{content:attr(data-n);position:absolute;top:2px;right:12px;background:var(--red);color:#fff;font:700 12px/20px var(--fb);min-width:20px;border-radius:10px;text-align:center}
#b-list{position:absolute;left:-6px;top:58%;z-index:800;width:64px;height:110px;border-radius:0 40px 40px 0;background:#fff;border:5px solid var(--navy);border-left:0;color:var(--navy);display:flex;align-items:center;justify-content:center}
#b-list[hidden]{display:none}
#mapbtns{position:absolute;left:12px;bottom:max(14px,env(safe-area-inset-bottom));z-index:800;display:flex;gap:10px}
.mg{display:flex;background:#fff;border:5px solid var(--navy);border-radius:36px;overflow:hidden}
.mg button{background:#fff;border:0;padding:10px 14px;color:var(--navy)}.mg button+button{border-left:3px solid var(--navy)}
/* tiroir */
#drawer{position:absolute;left:0;top:0;bottom:0;width:min(580px,100%);z-index:950;background:#e9ebf3;display:flex;flex-direction:column;box-shadow:4px 0 16px #0004}
.dh{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
.dh h3{flex:1;margin:0;text-align:center;color:var(--yellow);font:600 26px var(--f);letter-spacing:.04em}
.dh .x{background:none;border:0;color:#fff}
.dcols{background:var(--navy);color:#fff;display:grid;grid-template-columns:1.4fr 1fr 1fr 40px;align-items:center;padding:4px 14px 10px;font:500 17px var(--f);letter-spacing:.04em}
.dlist{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:6px 1.3fr 1fr .9fr 18px 34px;align-items:center;gap:8px;background:#fff;border-radius:6px;padding:10px 8px 10px 0;cursor:pointer;box-shadow:0 1px 2px #0002;font-family:var(--f);font-size:18px}
.row .cb,.unit .cb{width:6px;align-self:stretch;border-radius:3px}
.row b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .wear{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}.row .wear.bad{color:var(--red)}
.row .when{color:#333;font-size:16px;white-space:nowrap}
.row .mini{grid-column:span 2;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:6px 10px;font:600 14px var(--f)}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0002}.dot.green{background:#22b14c}.dot.red{background:var(--red)}
.ck{display:flex;align-items:center;justify-content:center}.ck input{width:24px;height:24px;accent-color:var(--navy)}
.dcols .ck input{accent-color:var(--yellow)}
.prog{height:9px;background:#e1e4f0;border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--green);border-radius:5px}
.prog.bad i{background:var(--red)}
.empty{padding:20px;text-align:center;color:var(--mut)}
.fleet{background:var(--navy);color:#fff;margin:0 10px;border-radius:14px 14px 0 0;padding:12px 16px;text-align:center}
.fleet h4{margin:0 0 8px;font:500 24px var(--f);letter-spacing:.04em}
.fleet .hint{font-size:13px;color:#c5cae6;margin-top:6px}
.go{background:var(--green);color:#fff;border:0;border-radius:6px;padding:10px 16px;font:600 19px var(--f);letter-spacing:.04em;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.go:disabled,button:disabled{opacity:.45;cursor:not-allowed}
.fleet .go{width:100%}.go.wide{width:100%;margin:6px 0}
.dtabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--navy);padding-bottom:env(safe-area-inset-bottom)}
.dtabs button{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 4px 8px;font:500 15px var(--f);letter-spacing:.03em;position:relative}
.dtabs button.on{background:var(--yellow);color:var(--navy)}
.dtabs .cnt{position:absolute;top:-10px;background:var(--blue);color:#fff;font:600 14px/26px var(--fb);min-width:30px;border-radius:13px;font-style:normal}
/* fenêtres */
#modal{position:fixed;inset:0;z-index:1000;background:#0b0f2bb3;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 12px 16px}
#modal[hidden],#drawer[hidden]{display:none}
.sheet{position:relative;background:var(--navy);border:4px solid var(--navy3);border-radius:18px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;padding:16px 14px 14px;box-shadow:0 10px 40px #0008}
.sheet h2{margin:0 36px 12px;text-align:center;color:var(--yellow);font:700 30px var(--f);letter-spacing:.06em;text-wrap:balance}
.mx{position:absolute;top:-14px;right:-10px;width:46px;height:46px;border-radius:50%;background:var(--red);border:3px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0006}
.stabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-bottom:10px}
.stabs button{background:var(--navy2);border:2px solid var(--navy3);color:#fff;font:600 17px var(--f);letter-spacing:.05em;padding:10px 4px}
.stabs button.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.sbody{overflow:auto;background:var(--paper);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.sbody p{margin:0}.sbody>*{flex-shrink:0}
.mut{color:var(--mut);font-size:13.5px}.pad{padding:0 2px}
.sum{display:grid;grid-template-columns:1fr 130px 1fr;align-items:center;background:var(--navy);color:#fff;border-radius:10px;padding:14px 10px;font-family:var(--f)}
.sum .half{display:flex;flex-direction:column;gap:6px;font-size:14px;letter-spacing:.03em}.sum .half.r{text-align:right;align-items:flex-end}
.pill{display:flex;align-items:center;gap:12px;background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;width:max-content}
.pill b{font-size:34px;font-weight:600}
.slots{position:relative;width:120px;height:120px;justify-self:center}
.slots svg{position:absolute;inset:0}.slots div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--navy)}
.slots b{font-size:24px}.slots small{font-size:10px;letter-spacing:.06em}
.slots .plus{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;border:3px solid #fff;font-size:20px;line-height:1}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--f)}
.chips button{background:var(--navy);color:#fff;border:2px solid var(--navy3);border-radius:20px;padding:5px 16px;font-size:16px;letter-spacing:.04em}
.chips button.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}.chips b{margin-left:auto;font-size:22px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mcard{background:#fff;border:0;border-radius:12px;padding:10px 0 0;text-align:center;display:flex;flex-direction:column;box-shadow:0 2px 6px #0002;overflow:hidden;min-width:0}
.mcard h5{margin:0 8px;font:600 19px var(--f);letter-spacing:.02em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .cap{color:#2547c8;font:600 15px var(--f);margin:2px 0 6px}
.mcard .pic{position:relative}.art{display:block;width:100%;height:auto}
.tags{position:absolute;top:6px;right:8px;display:flex;gap:4px}.tg{display:flex;align-items:center;justify-content:center;border-radius:6px;padding:2px 6px;font-style:normal}
.tg.b{background:#2f7de1}.tg.g{background:#2e9e4f}.tg.y{background:var(--yellow)}.tg svg rect,.tg svg circle{fill:#fff}.tg svg path{stroke:#2e9e4f}
.own{display:flex;align-items:center;justify-content:center;gap:12px;color:#2547c8;font:600 17px var(--f);padding:10px}.own i{font-style:normal;border:3px solid var(--navy);padding:0 8px;color:var(--navy)}
.mcard .spec{font-size:12.5px;color:var(--mut);padding:6px 10px}
.mcard .buy{margin:0 10px 10px;background:var(--green);color:#fff;border:0;border-radius:6px;padding:8px;font:600 17px var(--f)}
.mcard.lock{opacity:.6}.mcard.big{cursor:default}
.back{align-self:flex-start;background:none;border:0;color:var(--navy);font-weight:600}
.unit{display:flex;align-items:center;gap:10px;background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 2px #0002}
.unit>div:first-of-type{flex:1;min-width:0}.unit[data-act]{cursor:pointer}
.unit button,.btns button{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 12px;font:600 15px var(--f);letter-spacing:.02em}
.unit button.go,.btns button.go{background:var(--green)}
.btns .danger,.danger{background:#fff;color:var(--red);border:2px solid var(--red);border-radius:6px;padding:8px 12px;font:600 15px var(--f)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.sico{color:var(--navy)}
.sec{margin:6px 0 0;font:700 16px var(--f);letter-spacing:.06em;color:var(--navy)}
.form{display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:10px;padding:12px}
.form label,.sbody>label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);font-weight:600}
select,input:not([type=checkbox]){background:#fff;border:2px solid var(--line);border-radius:8px;padding:9px;width:100%;color:var(--ink);font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prev{background:#eef2ff;border-left:4px solid var(--blue);border-radius:6px;padding:10px;display:block;line-height:1.5}.prev>div+div{margin-top:4px}
.tlw{overflow-x:auto;border-radius:8px}.tl{font-size:13px}.tl td,.tl th{padding:5px 6px;white-space:nowrap}.tl td:first-child{white-space:normal;min-width:90px}
.err{background:#fde8e8;color:#9b1c1c;border-radius:6px;padding:8px 10px}
.mis{display:flex;align-items:center;gap:10px;background:#fff;border-radius:8px;padding:10px}.mis>div{flex:1}.mis small{color:var(--mut)}
.mis button{border:0;border-radius:6px;padding:8px 12px;font:600 16px var(--f);background:#cfd3e6;color:var(--ink)}.mis button.go{background:var(--green);color:#fff}
.mis.got{opacity:.6}.ok{color:var(--green);font-size:24px;font-weight:700}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpi div{background:#fff;border-radius:8px;padding:8px 10px;min-width:0}
.kpi span{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}.kpi b{font:600 19px var(--f);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.lvl{display:flex;flex-direction:column;gap:4px}
.spark{width:100%;height:auto;display:block}
.fuel{background:#fff;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.fh{display:flex;align-items:center;gap:10px}.fh b{flex:1;color:var(--ink);font:700 20px var(--f)}.fh span{font:600 20px var(--f);font-variant-numeric:tabular-nums}
.tank{height:16px;background:#e3e6f2;border-radius:8px;overflow:hidden}.tank i{display:block;height:100%}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;font-size:14px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.pos{color:var(--green)}.neg{color:var(--red)}
.bars{width:35%}.bars i{display:block;height:6px;border-radius:3px;margin:2px 0}.bars i.p{background:var(--green)}.bars i.n{background:var(--red)}
.msg{background:#fff;border-radius:8px;padding:10px}.msg.new{border-left:4px solid var(--yellow)}.msg small{float:right;color:var(--mut)}.msg p{margin:6px 0 0;color:#333}
.hubs{display:flex;flex-wrap:wrap;gap:8px}.hubchip{display:flex;flex-direction:column;align-items:flex-start;background:#fff;border:2px solid var(--yellow);border-radius:10px;padding:6px 10px;font:600 16px var(--f);color:var(--ink)}.hubchip small{font:500 12px var(--fb);color:var(--mut)}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}.regions button{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px;font:600 16px var(--f);text-align:left}
.hubok{background:#fff7d6;border:2px solid var(--yellow);border-radius:8px;padding:8px 10px;font-weight:600}.hubmk{filter:drop-shadow(0 1px 2px #0006)}
.rbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;background:#fff;border-radius:8px;padding:10px;font:600 17px var(--f);position:relative}
.rbar span{display:flex;justify-content:center;gap:6px;border-top:3px solid var(--blue);padding-top:6px}.rbar span i{font-style:normal;background:var(--blue);color:#fff;border-radius:6px;padding:1px 8px;font-size:15px}
.switch{display:flex!important;flex-direction:row!important;align-items:center;justify-content:center;gap:14px;font:600 17px var(--f)!important;color:var(--ink)!important;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}.switch i{width:56px;height:30px;border-radius:15px;background:#c9cede;position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:left .15s}
.switch input:checked+i{background:var(--green)}.switch input:checked+i::after{left:29px}.switch input:focus-visible+i{outline:3px solid var(--yellow)}
.info{background:#fff;border-radius:20px;padding:8px 14px;font-size:13.5px;color:var(--ink);box-shadow:0 1px 3px #0002}
.stops{display:flex;flex-direction:column;gap:4px}
.stoprow{display:grid!important;grid-template-columns:28px 1fr 120px 86px;align-items:center;gap:8px;background:#fff;border-radius:8px;padding:8px 10px;border-left:5px solid #c9cede;cursor:pointer;color:var(--ink)!important;font-weight:400!important}
.stoprow.on{border-left-color:var(--blue);background:#eef4ff}.stoprow input{width:22px;height:22px;accent-color:var(--blue)}
.stoprow .sn{font:600 16px var(--f);display:flex;flex-direction:column;min-width:0}.stoprow .sn small{font:400 12px var(--fb);color:var(--mut)}
.stoprow .sw{display:flex;flex-direction:column;gap:3px;font:600 13px var(--f);text-align:right}.stoprow .sw .prog{display:block;height:6px}
.stoprow .sio{text-align:right;font:600 14px var(--f);color:var(--mut)}
.palette{display:flex;flex-wrap:wrap;gap:6px}.palette button{width:30px;height:30px;border-radius:7px;border:3px solid #fff;box-shadow:0 0 0 1px #0003}.palette button.on{box-shadow:0 0 0 3px var(--ink)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dc{display:flex;align-items:center;gap:8px;background:#e4e7f1;border-radius:10px;overflow:hidden;min-width:0}
.dc .di{width:46px;align-self:stretch;display:flex;align-items:center;justify-content:center;background:#d7dbe9;font-size:20px}.dc div{padding:6px 4px;min-width:0}
.dc small{display:block;color:#2547c8;font-size:12.5px}.dc b{font:600 18px var(--f)}.warn{color:#e98a00}
.btns .yel,.yel{background:var(--yellow)!important;color:var(--ink)!important}
.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border-radius:8px;padding:8px}.stepper button{width:40px;height:40px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:22px}.stepper b{font:700 20px var(--f);min-width:50px;text-align:center}.stepper .mut{flex:1 1 180px}
.slider{display:flex;flex-direction:column;gap:6px;background:#fff;border-radius:8px;padding:10px;color:var(--ink)!important;font-weight:400!important}.slider input{accent-color:var(--navy)}
.band{background:#2f4f9e;color:#fff!important;text-align:center;padding:8px;border-radius:6px;font-size:18px!important}
.dlistx{display:flex;flex-direction:column;gap:6px}.dlistx>div{background:#e4e7f1;border-radius:8px;padding:10px;font:500 17px var(--f)}.dlistx .two>div{background:#e4e7f1;border-radius:8px;padding:10px}
.edit{background:#e4e7f1;border:0;border-radius:8px;padding:12px;text-align:left;color:#2547c8;font:600 18px var(--f);letter-spacing:.03em}
.stoptext{background:#e4e7f1;border-radius:8px;padding:10px;font:500 15px var(--f);line-height:1.5}
.tl tr.past td{color:#9aa0b8}.tl tr.next td{background:#fff7d6;font-weight:600}
.danger.wide{width:100%;padding:12px}
.help{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 118px);z-index:1100;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(440px,92%)}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:24px;box-shadow:0 4px 14px #0005;font-weight:600;text-align:center;animation:pop .25s ease-out}
.toast.bad{background:var(--red)}.toast.money{background:var(--green)}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
@media(max-width:620px){
  #top{gap:8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top))}
  #top .k b{font-size:19px}#top .k small{font-size:11px}
  .gauge,.gauge>svg{width:46px;height:46px}
  #co{font-size:15px;max-width:calc(100% - 40px)}
  #hex{top:112px;right:2px;gap:4px}
  .hx{width:74px}.hx .h{width:56px;height:48px}.hx .l{font-size:10.5px;padding:2px 6px;margin-top:-6px}
  .row{font-size:16px;grid-template-columns:6px 1.2fr 1fr .9fr 16px 30px;gap:6px}
  .dcols{font-size:14px}
  .sum{grid-template-columns:1fr 110px 1fr}.slots{width:104px;height:104px}.pill b{font-size:26px}
  .two{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr;gap:8px}.mcard h5{font-size:15px}.mcard .cap{font-size:13px}.own{font-size:14px;gap:6px}
  .sheet h2{font-size:24px}
}
@media(max-height:900px) and (min-width:621px){ #hex{top:96px;gap:2px} .hx .h{width:62px;height:54px} }
@media(max-width:620px){ #toasts{left:12px;right:84px;width:auto;transform:none} }
</style></head><body>

  <button class="hx" data-act="open" data-v="fuel"><span class="h"><svg class="ic" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 012-2h7a2 2 0 012 2v16M2 21h15M6 8h7M15 9l3 2v7a1.5 1.5 0 003 0V9l-3-3"/></svg></span><span class="l">CARBURANT</span></button>

  <button class="hx" data-act="open" data-v="service"><span class="h"><svg class="ic" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6a4 4 0 005 5l-9 9a2.1 2.1 0 01-3-3zM5 3l3 3-2 2-3-3z"/></svg></span><span class="l">ENTRETIEN</span></button>
 </nav>
 <button id="b-list" data-act="drawer" aria-label="Liste des trains"><svg class="ic" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.4" fill="currentColor"/><circle cx="3.5" cy="12" r="1.4" fill="currentColor"/><circle cx="3.5" cy="18" r="1.4" fill="currentColor"/></svg></button>
